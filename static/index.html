
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense & Budget Tracker</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>Expense & Budget Tracker</h1>
        <p>Manage your income and expenses easily.</p>
    </header>

    <main>

        <!-- Summary Cards -->
        <section class="summary">

            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">Rs. 0.00</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">Rs. 0.00</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">Rs. 0.00</p>
            </div>

        </section>

        <!-- Add Transaction Form -->
        <section class="panel">

            <h2>Add a Transaction</h2>

            <form id="transaction-form">

                <label for="type">Transaction Type</label>
                <select id="type" name="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="e.g. Lunch or Salary"
                    required
                >

                <label for="amount">Amount (Rs.)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="category">Category</label>
                <input
                    type="text"
                    id="category"
                    name="category"
                    placeholder="e.g. Food or Salary"
                    required
                >

                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

                <button type="submit" id="submit-button">
                    Add Transaction
                </button>

            </form>

            <p id="message" role="status"></p>

        </section>

        <!-- Transaction List -->
        <section class="panel">

            <h2>Transactions</h2>

            <!-- Filters -->
            <div class="filters">

                <div>
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="">All Transactions</option>
                        <option value="income">Income</option>
                        <option value="expense">Expenses</option>
                    </select>
                </div>

                <div>
                    <label for="filter-category">Filter by Category</label>
                    <input
                        type="text"
                        id="filter-category"
                        placeholder="Enter category"
                    >
                </div>

            </div>

            <!-- Transactions Table -->
            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="transaction-list">
                        <tr>
                            <td colspan="6">Loading transactions...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="/static/script.js"></script>

</body>
</html>
