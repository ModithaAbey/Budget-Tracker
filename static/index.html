<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense & Budget Tracker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Website Header -->
    <header>
        <h1>Expense & Budget Tracker</h1>
        <p>Manage your income and expenses easily.</p>
    </header>

    <main>

        <!-- Summary Cards -->
        <section class="summary">

            <div class="card">
                <h3>Total Income</h3>
                <p id="total-income">Rs. 0.00</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">Rs. 0.00</p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p id="balance">Rs. 0.00</p>
            </div>

        </section>

        <!-- Add Transaction Form -->
        <section class="panel">

            <h2>Add a Transaction</h2>

            <form id="transaction-form">

                <!-- Transaction Type -->
                <label for="type">Transaction Type</label>
                <select id="type" name="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>

                <!-- Description -->
                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="e.g. Lunch or Salary"
                    required
                >

                <!-- Amount -->
                <label for="amount">Amount (Rs.)</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <!-- Category Dropdown -->
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Health">Health</option>
                    <option value="Education">Education</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Salary">Salary</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Other">Other</option>
                </select>

                <!-- Date -->
                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

                <!-- Submit Button -->
                <button type="submit" id="submit-button">
                    Add Transaction
                </button>

            </form>

            <!-- Success or Error Message -->
            <p id="message" role="status"></p>

        </section>

        <!-- Transaction List -->
        <section class="panel">

            <h2>Transactions</h2>

            <!-- Filters -->
            <div class="filters">

                <!-- Type Filter -->
                <div>
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="">All Transactions</option>
                        <option value="income">Income</option>
                        <option value="expense">Expenses</option>
                    </select>
                </div>

                <!-- Category Filter Dropdown -->
                <div>
                    <label for="filter-category">
                        Filter by Category
                    </label>

                    <select id="filter-category">
                        <option value="">All Categories</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Education">Education</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Salary">Salary</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

            
            
        <!-- Filter by Date -->
                     <div>
        <label for="filter-date">Filter by Date</label>
        <select id="filter-date">
            <option value="all">All Dates</option>
            <option value="today">Today</option>
            <option value="yesterday">Yesterday</option>
            <option value="last7days">Last 7 Days</option>
            <option value="lastmonth">Last Month</option>
            <option value="custom">Custom Date Range</option>
        </select>
    </div>

    <!-- Custom Date Range -->
    <div id="custom-date-range" style="display: none;">

        <label for="start-date">Start Date</label>
        <input type="date" id="start-date">

        <label for="end-date">End Date</label>
        <input type="date" id="end-date">

    </div>
    </div>
            

            <!-- Transactions Table -->
            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="transaction-list">
                        <tr>
                            <td colspan="6">Loading transactions...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- JavaScript -->
    <script src="/static/script.js"></script>

</body>

</html>
